[package]
name = "kleos-sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
# Sidecar only uses kleos-lib for LLM client, but rusqlite still compiles
# so Windows needs bundled-sqlite to avoid missing sqlite3.lib
kleos-lib = { path = "../kleos-lib" }

[target.'cfg(windows)'.dependencies]
kleos-lib = { path = "../kleos-lib", features = ["bundled-sqlite"] }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
